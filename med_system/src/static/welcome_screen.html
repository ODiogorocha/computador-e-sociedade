<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSystem - Bem-vindo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Paleta de cores em azul e branco, mantendo a consistência do MedSystem */
            --primary-color: #007bff; /* Azul primário */
            --secondary-color: #6c757d; /* Azul acinzentado secundário */
            --accent-color: #e9ecef; /* Branco acinzentado para o fundo */
            --light-bg: #ffffff; /* Branco puro para containers */
            --dark-bg: #343a40; /* Cinza escuro para texto principal */
            --text-color-light: #6c757d; /* Cinza claro para texto secundário */
            --text-color-white: white;
            --shadow-light: rgba(0, 0, 0, 0.05);
            --shadow-medium: rgba(0, 0, 0, 0.1);
            --shadow-button: rgba(0, 123, 255, 0.3); /* Sombra azul para o botão */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--accent-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .welcome-container {
            background: var(--light-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px var(--shadow-medium);
            width: 95%;
            max-width: 900px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .welcome-header {
            background: var(--primary-color);
            padding: 30px;
            text-align: center;
            color: var(--text-color-white);
            position: relative;
            z-index: 1;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        /* Alterado o ícone para um hospital */
        .logo {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--text-color-white);
            text-shadow: 0 2px 10px var(--shadow-medium);
        }

        .app-name {
            font-size: 2.5rem;
            font-weight: 700;
            /* margin-bottom removido ou ajustado para o novo layout sem tagline */
            margin-bottom: 0; /* Remove a margem extra, já que a tagline foi removida */
            letter-spacing: 1px;
        }

        /* Removido completamente: .tagline { ... } */

        .welcome-body {
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .start-button-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .start-button-image {
            width: 80px;
            height: auto;
            border-radius: 5px;
        }

        .start-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary-color);
            color: var(--text-color-white);
            font-size: 1.3rem;
            font-weight: 600;
            padding: 18px 60px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 20px var(--shadow-button);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 123, 255, 0.4);
        }

        .start-button:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
        }

        .start-button .fas {
            font-size: 1.2rem;
        }

        .decoration {
            position: absolute;
            opacity: 0.1;
            z-index: 0;
        }

        .decoration-1 {
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #fff;
        }

        .decoration-2 {
            bottom: -80px;
            left: -80px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #fff;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-color-light);
            font-size: 0.9rem;
            margin-top: auto;
        }

        /* Media Queries para Responsividade */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .welcome-container {
                width: 100%;
                border-radius: 15px;
            }

            .welcome-header {
                padding: 25px 15px;
            }

            .logo {
                font-size: 3rem;
            }

            .app-name {
                font-size: 2.2rem;
                margin-bottom: 0; /* Garante que a margem seja 0 em mobile também */
            }

            /* Removido completamente: .tagline { ... } */

            .welcome-body {
                padding: 30px 20px;
                min-height: 150px;
            }

            .start-button-container {
                flex-direction: column;
                gap: 15px;
            }

            .start-button-image {
                width: 60px;
            }

            .start-button {
                padding: 16px 50px;
                font-size: 1.2rem;
                width: 90%;
                max-width: 300px;
            }
        }

        @media (max-width: 480px) {
            .welcome-header {
                padding: 20px;
            }

            .logo {
                font-size: 2.5rem;
            }

            .app-name {
                font-size: 2rem;
                margin-bottom: 0; /* Garante que a margem seja 0 em mobile também */
            }

            /* Removido completamente: .tagline { ... } */

            .welcome-body {
                padding: 25px 15px;
            }

            .start-button-image {
                width: 50px;
            }

            .start-button {
                padding: 14px 40px;
                font-size: 1.1rem;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>

        <div class="welcome-header">
            <div class="logo-container">
                <i class="fas fa-hospital-alt logo" aria-hidden="true"></i>
            </div>
            <h1 class="app-name">MedSystem</h1>
            </div>

        <div class="welcome-body">
            <div class="start-button-container">
                <img src="https://via.placeholder.com/80/007bff/FFFFFF?Text=MedSystem" alt="Logotipo MedSystem" class="start-button-image">
                <a href="index.html" class="start-button">
                    <i class="fas fa-arrow-right" aria-hidden="true"></i> Acessar
                </a>
            </div>
        </div>
    </div>

</body>
</html>
